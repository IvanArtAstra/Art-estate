# Деплой моста «чат на сайте ↔ Telegram».
#   npm i -g wrangler && wrangler login
#   wrangler kv namespace create CHAT      → вставьте выданный id ниже
#   wrangler secret put BOT_TOKEN          → токен от @BotFather
#   wrangler secret put AGENT_CHAT_ID      → ваш chat_id (как узнать — в README)
#   wrangler secret put WEBHOOK_SECRET     → любая случайная строка
#   wrangler deploy
#
# Секреты в этот файл НЕ вписываются — они хранятся на стороне Cloudflare.

name = "estate-art-chat"
main = "worker.js"
compatibility_date = "2026-09-01"

# Воркер по умолчанию выполняется в ближайшей к посетителю точке — для нас это
# Гонконг, а оттуда запросы к Anthropic отбивает защита перед их API: 403
# отдаёт Cloudflare, а не сам API (в ответе нет ни одного заголовка anthropic-*).
# Smart placement переносит выполнение ближе к бэкенду, с которым воркер
# разговаривает больше всего.
[placement]
mode = "smart"

[vars]
# Откуда виджету разрешено обращаться. Через запятую, без пробелов.
ALLOWED_ORIGINS = "https://estateart.homes,https://www.estateart.homes,https://ivanartastra.github.io,http://localhost:8123,http://127.0.0.1:8123"
SITE_URL = "https://estateart.homes/"
# Публичный канал @EstateArt — витрина для подписчиков. Заявки, карточки писем
# и служебные уведомления туда не уходят, даже если id канала попал в
# AGENT_CHAT_ID или MAIL_CHAT_ID. Через запятую, если каналов несколько.
CHANNEL_CHAT_ID = "-1003863870018"
# Очередь первых писем партнёрам: дневной лимит по неделям от первого
# отправленного письма — 10, потом 20, 30 и дальше 40 в день. Отправка — в рабочие
# часы Вьетнама (Пхукет в том же поясе, Бали на час впереди).
OUTREACH_DAILY = "10,20,30,40"
OUTREACH_PER_TICK = "1"
OUTREACH_FROM_HOUR = "8"
OUTREACH_TO_HOUR = "18"
# Напоминание молчащему партнёру: через 5 дней, отменить можно в течение 6 часов
REMIND_AFTER_DAYS = "5"
REMIND_DELAY_HOURS = "6"
# Скрытая копия в MAIL_FORWARD_TO — только у ответов партнёрам, рассылка без копии
OUTBOX_BCC_KINDS = "reply"

[[kv_namespaces]]
binding = "CHAT"
id = "f50b5d6be4764a169857081df5f1ac59"

# Реле к Anthropic, закреплённое за регионом. Регион задаётся не здесь,
# а при создании объекта — locationHint в bot/ai.js.
[[durable_objects.bindings]]
name = "AI_RELAY"
class_name = "AnthropicRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AnthropicRelay"]

# ---------- переписка с партнёрами (bot/partners.js) ----------

# Отправка писем с partners@estateart.homes через Cloudflare Email Sending.
# На произвольные адреса — только после подключения домена к Email Sending
# (тариф Workers Paid). До этого письма уходят лишь на подтверждённые адреса.
[[send_email]]
name = "EMAIL"

# Раз в полчаса: очередь писем, напоминания молчащим, уведомление об одобрении
[triggers]
crons = ["*/30 * * * *"]
