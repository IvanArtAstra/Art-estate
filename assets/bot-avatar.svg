<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="28%" cy="18%" r="120%">
      <stop offset="0"   stop-color="#14524a"/>
      <stop offset=".42" stop-color="#0f3f3a"/>
      <stop offset="1"   stop-color="#082825"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2a8a93" stop-opacity=".26"/>
      <stop offset="1" stop-color="#2a8a93" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#e3c378" stop-opacity="0"/>
      <stop offset=".5"  stop-color="#e3c378" stop-opacity=".85"/>
      <stop offset="1"   stop-color="#e3c378" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- намёк на море внизу, а не картинка: аватар смотрят размером с ноготь -->
  <rect y="338" width="512" height="174" fill="url(#sea)"/>
  <!-- Рамка круглая, а не квадратная: Telegram обрезает аватар в круг, и углы
       квадрата ушли бы, оставив четыре обрубка по сторонам. -->
  <circle cx="256" cy="256" r="226" fill="none"
          stroke="#b08c3d" stroke-opacity=".5" stroke-width="1.5"/>

  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <!-- text-anchor=middle считает и хвостовой межбуквенный интервал,
         поэтому центр сдвинут на половину интервала вправо -->
    <text x="261" y="232" font-size="73" font-weight="600"
          letter-spacing="11" fill="#fffdf8">ESTATE</text>
    <text x="258" y="322" font-size="92" font-style="italic"
          letter-spacing="4" fill="#e3c378">Art</text>
    <text x="260" y="398" font-size="17" letter-spacing="7.5"
          fill="#fffdf8" fill-opacity=".62">PHUKET · VIETNAM</text>
  </g>
  <rect x="190" y="356" width="132" height="1.2" fill="url(#rule)"/>
</svg>
